[package]
name = "nodemind-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
futures-util = "0.3.34"
genai = "0.7.0"
rand = "0.9"
schemars = { version = "1.2.3", features = ["uuid1", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Throwaway Postgres for tests when DATABASE_URL is unset (no Docker needed).
postgresql_embedded = { version = "0.21", features = ["tokio"] }
proptest = "1"

# Custom harness: one Postgres server shared by all cases, stopped on exit.
[[test]]
name = "schema"
harness = false

[[test]]
name = "metering"
harness = false

[[test]]
name = "http"
harness = false

[[test]]
name = "auth"
harness = false
